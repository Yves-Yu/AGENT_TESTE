<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e40af;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header a { color: #bfdbfe; font-size: 13px; text-decoration: none; }
    header a:hover { color: #fff; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      background: #1e40af;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      background: #fff;
      border: 1px solid #e5e7eb;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.loading {
      background: #f3f4f6;
      color: #9ca3af;
      align-self: flex-start;
      font-style: italic;
      border-bottom-left-radius: 4px;
    }

    #metrics-bar {
      display: none;
      background: #eff6ff;
      border-top: 1px solid #dbeafe;
      padding: 6px 20px;
      font-size: 12px;
      color: #3b82f6;
      flex-shrink: 0;
    }

    #input-area {
      display: flex;
      padding: 14px 16px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      gap: 10px;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    #msg-input:focus { border-color: #1e40af; }
    #send-btn {
      padding: 11px 22px;
      background: #1e40af;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    #send-btn:hover:not(:disabled) { background: #1e3a8a; }
    #send-btn:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Shopping Agent</h1>
    <a href="/dashboard">Dashboard de Observabilidade →</a>
  </header>

  <div id="chat">
    <div class="msg agent">
      Olá! Sou o Shopping Agent. Descreva o produto ou serviço que você busca
      e os critérios que importam para você — preço, prazo de entrega, marca,
      avaliação, especificações técnicas, etc.

      Exemplo: <em>"notebook para trabalho, até R$3000, boa bateria"</em>
    </div>
  </div>

  <div id="metrics-bar"></div>

  <div id="input-area">
    <input
      type="text"
      id="msg-input"
      placeholder="Ex: notebook Dell para trabalho, até R$3.000, bateria acima de 8h..."
      autocomplete="off"
    />
    <button id="send-btn">Pesquisar</button>
  </div>

  <script>
    const chatEl   = document.getElementById('chat');
    const input    = document.getElementById('msg-input');
    const sendBtn  = document.getElementById('send-btn');
    const metricsB = document.getElementById('metrics-bar');

    // Um id por sessão de navegador (sobrevive a reload da página via
    // sessionStorage) — é isso que dá memória de conversa ao agente entre
    // mensagens; sem ele, cada mensagem viraria uma conversa nova do zero.
    let conversationId = sessionStorage.getItem('conversationId');
    if (!conversationId) {
      conversationId = crypto.randomUUID();
      sessionStorage.setItem('conversationId', conversationId);
    }

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = '';
      sendBtn.disabled = true;
      addMsg(text, 'user');
      const loading = addMsg('Pesquisando… isso pode levar alguns segundos enquanto visito os sites.', 'loading');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, user_id: 'web-user', conversation_id: conversationId }),
        });
        const data = await res.json();
        loading.remove();
        if (res.ok) {
          addMsg(data.answer, 'agent');
          const runShort = (data.run_id || '').substring(0, 8);
          metricsB.style.display = 'block';
          metricsB.textContent =
            `Run ${runShort}… | Tokens: ${data.tokens_in} entrada / ${data.tokens_out} saída | ` +
            `Custo estimado: $${(data.cost_usd || 0).toFixed(5)} USD`;
        } else {
          addMsg(`Erro: ${data.detail || 'falha desconhecida.'}`, 'loading');
        }
      } catch (e) {
        loading.remove();
        addMsg('Erro de conexão. Verifique se o servidor está rodando.', 'loading');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
